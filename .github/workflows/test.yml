name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 has no setup-python build for Python 3.9.
        os: [ubuntu-24.04, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Zero dependencies: nothing to install. Each test file gets its own
      # throwaway HOME and KYMA_HOME, so no runner state leaks in.
      - run: python tests/run.py
