[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyma-local"
dynamic = ["version"]
description = "See the agents you have run and what your rules would have stopped. Then turn the rules on."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
kyma = "kyma.cli:main"

[project.urls]
Source = "https://github.com/kymacomputer/kyma-local"

[tool.setuptools.dynamic]
# One version, in src/kyma/__init__.py: `kyma mcp` reports the same one.
version = { attr = "kyma.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
